poll_interval_seconds: 600
marketplace_id: EBAY_GB
currency: GBP
database_path: data/ebay_monitor.sqlite3
dry_run: false

fetch:
  homepage_url: https://www.ebay.co.uk/
  search_url: https://www.ebay.co.uk/sch/i.html
  identity_id: ebay_uk_default
  session_directory: data/sessions
  impersonate: chrome
  locale: en-GB
  proxy_url: ""
  warm_homepage_first: true
  use_camoufox_on_start: false
  use_camoufox_on_challenge: true
  camoufox_headless: true
  camoufox_wait_ms: 3000
  request_timeout_seconds: 45
  request_retries: 1
  retry_backoff_seconds: 2
  max_concurrent_requests: 6
  cycle_timeout_seconds: 300

search:
  limit_per_page: 100
  max_pages_per_keyword: 2
  buying_options:
    - bin
    - auction
  keywords:
    - pokemon etb
    - pokemon center etb
    - pokemon booster box
    - pokemon booster bundle
    - pokemon premium collection
    - pokemon collection box
    - pokemon tin
    - pokemon graded card
    - pokemon japanese booster box
    - pokemon japanese sealed
    - one piece booster box
    - one piece booster display
    - one piece japanese booster box
    - one piece sealed case
    - one piece graded card
  excluded_title_terms:
    - empty box
    - digital
    - proxy
    - custom proxy
    - code card
    - online code
    - resealed

pricing:
  alert_threshold_below_median: 0.28
  min_baseline_samples: 5
  uncertain_listing_alerts: true
  priority_weight_mixed_lot: 15
  priority_weight_exclusive: 20
  max_alerts_per_cycle: 5

parser:
  assumed_case_units:
    pokemon_center_etb: 4
    elite_trainer_box: 10
    booster_box: 6
    one_piece_booster_box: 12
    booster_bundle: 10
    premium_collection: 6
    tin: 12
